name: Build & Release JARVIS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve & Auto-Increment Release Version
        id: pkg
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/resolve-version.js

      - name: Install dependencies (including devDependencies)
        run: npm install --include=dev
        env:
          NODE_ENV: development

      - name: Rebuild native modules for Electron
        run: node scripts/rebuild-native.js
        env:
          NODE_ENV: development

      - name: Build Electron App Installer
        run: npm run dist
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect Build Artifacts
        shell: bash
        run: |
          echo "=== Generated Dist Files ==="
          ls -la dist/

      - name: Publish Live GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ env.TAG }}
          name: JARVIS ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          overwrite: true
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
