name: Build & Release JARVIS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read package version
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "App Version: $VERSION"

      - name: Install dependencies (including devDependencies)
        run: npm install --include=dev
        env:
          NODE_ENV: development

      - name: Rebuild native modules for Electron
        run: node scripts/rebuild-native.js
        env:
          NODE_ENV: development

      - name: Build Electron App Installer
        run: npm run dist
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Live GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: JARVIS ${{ env.TAG }}
          body: |
            ## 🚀 JARVIS Desktop Release ${{ env.TAG }}
            
            ### ✨ What's New:
            - **Phase 3 Cloud Voice API System**: Realtime Speech-to-Text (STT) and Text-to-Speech (TTS) via Google AI (Gemini), ElevenLabs, OpenAI, and Groq Cloud.
            - **9-Step Verified Voice Key Flow**: Live endpoint verification, dynamic voice/model discovery, and mandatory audio playback testing.
            - **Voice Conversation Loop**: Realtime voice capture, cloud transcription, streamed LLM responses, and voice synthesis with instant stop/interrupt support.
            - **Auto-Updater & SQLite Vault**: Secure AES-256-GCM encryption with seamless desktop auto-updating.
            
            ### 📦 Download & Install:
            - Download `JARVIS-Setup-${{ env.VERSION }}.exe` below and run the installer.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
